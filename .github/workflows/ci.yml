name: CI

on:
  push:
  pull_request:

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/booking-availability/index.ts supabase/functions/booking-create/index.ts supabase/functions/admin-bookings/index.ts supabase/functions/send-whatsapp-notifications/index.ts supabase/functions/whatsapp-webhook/index.ts
      - run: deno test supabase/functions/_shared/validation_test.ts

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - run: supabase start -x studio,imgproxy,mailpit,logflare,vector,supavisor
      - run: supabase db reset
      - run: supabase test db
      - run: npm run test:concurrency
